# -------------------------------------------------------------------
# 基础配置
# -------------------------------------------------------------------
mode: rule
allow-lan: true
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

# -------------------------------------------------------------------
# 外部控制 (WebUI)
# -------------------------------------------------------------------
# 外部控制端口，配合浏览器访问 http://127.0.0.1:9090/ui
external-controller: 0.0.0.0:9090
# 访问密钥，建议修改
secret: "123456"
# Web 面板存放目录（对应我们之前 git clone 的位置）
external-ui: ui

# -------------------------------------------------------------------
# TUN 模式配置 (核心：让系统流量走代理)
# -------------------------------------------------------------------
tun:
  enable: true
  stack: system # 使用系统协议栈，兼容性最好
  auto-route: true # 自动设置路由表
  auto-detect-interface: true # 自动检测出口网卡
  dns-hijack:
    - any:53 # 劫持所有 53 端口的 DNS 请求
  device: Meta # 网卡名称，对应 ip a 看到的名字

# -------------------------------------------------------------------
# DNS 配置 (防止 DNS 污染)
# -------------------------------------------------------------------
dns:
  enable: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - tls://8.8.8.8:853
    - https://1.1.1.1/dns-query

# -------------------------------------------------------------------
# 订阅转换 (使用提供商功能自动拉取节点)
# -------------------------------------------------------------------
proxy-providers:
  my-provider:
    type: http
    # 你的订阅链接
    url: "https://9sub.yylxjichang.lol/api/v1/client/subscribe?token=b2cc1f76d4de362007e202b7e5995f6d"
    interval: 3600
    path: ./provider.yaml
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204

# -------------------------------------------------------------------
# 策略组
# -------------------------------------------------------------------
proxy-groups:
  # 自动选择延迟最低的节点
  - name: "🚀 自动选择"
    type: url-test
    use:
      - my-provider
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  # 手动选择节点
  - name: "代理选择"
    type: select
    use:
      - my-provider
    proxies:
      - "🚀 自动选择"
      - DIRECT

# -------------------------------------------------------------------
# 分流规则
# -------------------------------------------------------------------
rules:
  - DOMAIN-SUFFIX,google.com,代理选择
  - DOMAIN-KEYWORD,github,代理选择
  - DOMAIN-SUFFIX,youtube.com,代理选择
  - GEOIP,CN,DIRECT
  - MATCH,代理选择
