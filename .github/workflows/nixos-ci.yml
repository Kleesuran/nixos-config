name: NixOS CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: nixos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nixos-check:
    name: Flake Check And Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show Nix Version
        run: nix --version

      - name: Flake Metadata
        run: nix flake metadata

      - name: Flake Check
        run: nix flake check --print-build-logs -L

      - name: Build Klee System
        run: nix build .#nixosConfigurations.klee.config.system.build.toplevel --print-build-logs -L
